name: Nightly develop

# develop 이 실제로 성한지 하루 한 번 확인한다(#546).
#
# ─────────────────────────────────────────────────────────────────────────
# 왜 필요한가
#
# `ci.yml` 은 `pull_request` 와 `push: [main]` 에서만 돈다. **develop 자체는 아무도
# 검사하지 않는다.** 그리고 PR 의 CI 는 그 PR 의 base 만 본다 — 머지 결과는 검사
# 대상이 아니다.
#
# 그래서 각자 초록인 PR 들이 합쳐진 뒤에 깨지는 일이 실제로 다섯 번 났다.
#
#   #527 · #530 · #534   #524 가 지운 컴포넌트를 다시 import 해 빌드가 깨짐
#   #540 vs #530         ERD 가 마이그레이션 026 을 못 봄
#
# 브랜치 보호의 `strict: true`(#546 A안)가 «base 가 낡은 채 머지» 를 막지만,
# **이미 머지된 뒤에 생기는 어긋남**은 못 잡는다. 사람이 직접 push 한 경우나,
# 두 변경이 각자 최신 base 위에서 만들어졌는데 합쳐서 깨지는 경우가 남는다.
#
# 이 워크플로가 그 자리를 메운다. 깨진 뒤에 알게 되지만 **모르는 것보다 낫고**,
# 비용은 하루 한 번이다.
#
# ─────────────────────────────────────────────────────────────────────────
# 게이트는 ci.yml 과 같은 것을 쓴다
#
# 여기서만 도는 검사를 만들지 않는다. 두 벌이 되면 한쪽만 고쳐지고, develop 이
# 통과하는데 PR 이 막히는(또는 그 반대) 상태가 생긴다.
#
# 다만 `Release artifacts in sync with main` 은 뺐다 — 그것은 develop 대상 PR 에서
# 만 도는 검사(`github.base_ref == 'develop'`)라 여기서는 조건 자체가 성립하지 않는다.

on:
  schedule:
    # 매일 19:00 UTC = 04:00 KST. 야간 작업이 끝난 뒤, 아침에 열어보기 전이다.
    - cron: '0 19 * * *'
  # 손으로도 돌릴 수 있게 둔다. 큰 머지 직후에 기다리지 않고 확인할 때 쓴다.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: client

      - name: Check JS syntax
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Docs inventory matches code
        run: npm run docs:inventory:check

      - name: Docs cover routes and tables
        run: npm run docs:check

      - name: ERD matches schema
        run: npm run docs:erd:check

      - name: Lint (no-undef)
        run: npm run lint

      - name: Test ports do not collide
        run: npm run test:ports

      - name: Audit dependencies (root)
        run: npm audit --audit-level=high

      - name: Audit dependencies (client)
        run: npm audit --audit-level=high
        working-directory: client

      - run: npm run build
        working-directory: client

      - name: Test client (vitest)
        run: npm run test:coverage
        working-directory: client

      - name: Test server (node --test)
        run: npm run test:coverage --if-present
