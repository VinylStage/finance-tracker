name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # job 을 셋으로 나눈 이유(#619)
  #
  # 예전에는 전부 한 job 에서 순차로 돌았다. 클라이언트 테스트 90초 + 서버 30초 +
  # 나머지라 벽시계가 **합계**였고, CI 한 번에 150초가 걸렸다.
  #
  # 나누면 벽시계가 합계에서 **최댓값**이 된다. `npm ci` 를 job 마다 다시 하므로
  # 총 러너 시간은 늘지만, 줄어드는 것은 **사람이 기다리는 시간**이고 그게 목적이다.
  #
  # 필수 검사 이름(`ci`)은 맨 아래 게이트 job 이 그대로 들고 있다 — 이름이 사라지면
  # 브랜치 보호가 깨진다.

  checks:
    name: Checks (docs · lint · ports · audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: client
      - name: Check JS syntax
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check

      # ARCHITECTURE.md 의 라우트·페이지·컴포넌트 목록은 코드에서 생성한다.
      # 손으로 유지하다 세 번 낡았고(FND-17), PR 템플릿 체크박스로는 또 놓쳤다.
      - name: Docs inventory matches code
        run: npm run docs:inventory:check

      # 인벤토리 생성이 막는 것은 ARCHITECTURE.md 하나다. API.md 와
      # DATA_MODEL.md 는 본문을 코드에서 만들 수 없어 생성 대상이 아니었고,
      # 그래서 강제도 없었다 — 마운트 26개 중 7개, 실테이블 22개 중 3개가 통째로
      # 빠진 채였다(#496). 내용까지 검사하지는 못해도 통째로 빠지는 것은 막는다.
      - name: Docs cover routes and tables
        run: npm run docs:check
      # ERD 는 mermerd(Go) 로 그리지만, 이 검사는 스키마 지문만 다시 계산해
      # 비교하므로 CI 에 Go 를 깔 필요가 없다.
      - name: ERD matches schema
        run: npm run docs:erd:check
      # node --check 는 문법만 보고 서버 src/ 만 본다. 정의되지 않은 식별자는
      # 잡지 못해, import 를 빠뜨린 코드가 테스트 전부 초록인 채로 배포됐다가
      # 브라우저에서 ReferenceError 로 죽은 적이 있다. 여기가 그 자리를 막는다.
      - name: Lint (no-undef)
        run: npm run lint
      # 포트가 겹치면 단독 실행은 통과하고 전체 스위트에서만 간헐 실패한다.
      # 재실행하면 통과해서 원인을 짚기 전까지 무엇이 문제인지 안 보인다.
      # 실제로 두 번 냈고 둘 다 별도 서버를 `PORT + 1` 로 띄운 것이 원인이었다.
      - name: Test ports do not collide
        run: npm run test:ports
      # 릴리즈 아티팩트가 main 과 어긋난 채로 develop 이 굴러가면, develop → main
      # 릴리즈 PR 에서 네 파일이 충돌하고 소유자 bypass 를 쓰게 된다
      # (CONTRIBUTING.md 조건 1번). 세 릴리즈 연속 놓쳤던 자리라 사람 기억 대신
      # 여기서 막는다. develop 대상 PR 에서만 돈다 — 릴리즈 PR 은 버전을 올리는
      # 것이 목적이므로 검사 대상이 아니다.
      - name: Release artifacts in sync with main
        if: github.base_ref == 'develop'
        run: |
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          ./scripts/check-release-sync.sh

      - name: Audit dependencies (root)
        run: npm audit --audit-level=high
      - name: Audit dependencies (client)
        run: npm audit --audit-level=high
        working-directory: client

  # ───────────────────────────────────────────────────────────────────────
  # 클라이언트를 샤드 둘로 쪼갠 이유(#630)
  #
  # job 분리(#619) 뒤에 남은 장대가 이 job 하나였다. 112초 중 **96초가 vitest 자체**라
  # 오버헤드(setup+npm ci+build 16초)에서는 짤 것이 없었다.
  #
  # **커버리지 게이트를 잃지 않는다.** 샤드는 자기가 실행한 파일만 놓고 커버리지를
  # 계산하므로 단독으로는 분모가 쪼그라들지만(실측 73.25 / 67.03), `--reporter=blob`
  # 으로 기록해 `--mergeReports` 로 합치면 전체 실행과 **소수점까지 같아진다**
  # (93.92 / 90.89 / 91.03 / 95.51). 그래서 규칙이 하나 생긴다 —
  #
  #   샤드 job    게이트를 돌리지 않는다. blob 만 뜬다
  #   병합 job    게이트를 여기서 한 번 돈다
  #
  # 샤드가 각자 게이트를 돌면 **거짓 실패**가 난다(75.87% 가 90% 미달로 잡힌다).
  # 그래서 샤드 job 은 임계값을 0 으로 눌러 끈다.
  client:
    name: Test client (vitest) ${{ matrix.shard }}/2
    runs-on: ubuntu-latest
    strategy:
      # 한 샤드가 깨져도 나머지를 끝까지 돌린다. 어느 샤드가 깨졌는지만 보고
      # 끝내면 다른 샤드의 실패를 다음 실행에서 또 발견한다.
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # 이 job 은 서버 의존성을 안 쓴다. 빌드와 vitest 만 돈다.
      - run: npm ci
        working-directory: client
      - run: npm run build
        working-directory: client
      # 임계값을 0 으로 눌러 게이트를 끈다. 샤드 커버리지로 판정하면 안 된다.
      - name: Test client shard ${{ matrix.shard }}/2
        run: >-
          npx vitest run --shard=${{ matrix.shard }}/2 --coverage --reporter=blob
          --coverage.thresholds.lines=0 --coverage.thresholds.branches=0
          --coverage.thresholds.functions=0 --coverage.thresholds.statements=0
        working-directory: client
      - uses: actions/upload-artifact@v4
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: client/.vitest-reports/*
          retention-days: 1
          if-no-files-found: error
          # `.vitest-reports` 는 **점으로 시작하는 디렉터리**다. upload-artifact v4 는
          # 숨김 파일을 기본으로 제외해서, blob 이 제대로 쓰였는데도
          # «No files were found» 로 죽는다(첫 실행에서 실제로 겪었다 —
          # 로그에 `blob report written to …/client/.vitest-reports/blob-1-2.json` 이
          # 찍힌 뒤 업로드가 빈손으로 끝났다).
          include-hidden-files: true

  # 샤드 결과를 합쳐 **커버리지 게이트를 여기서 한 번** 돈다.
  #
  # `--mergeReports` 는 테스트를 다시 돌리지 않는다. 기록만 읽어 리포트를 내므로
  # 이 job 은 몇 초짜리다 — 비용은 npm ci 와 artifact 내려받기 쪽이다.
  client-coverage:
    name: Test client (coverage gate)
    needs: [client]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        working-directory: client
      - uses: actions/download-artifact@v4
        with:
          pattern: vitest-blob-*
          path: client/.vitest-reports
          merge-multiple: true
      - name: Merge shard reports and check coverage
        run: npx vitest --mergeReports --coverage
        working-directory: client

  server:
    name: Test server (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # 이 job 은 클라이언트 의존성을 안 쓴다.
      - run: npm ci
      - run: npm run test:coverage --if-present

  # 브랜치 보호가 요구하는 이름은 `ci` 하나다. 위 셋을 여기서 모은다.
  #
  # `if: always()` 와 명시적 판정을 쓴다. 그냥 `needs` 만 두면 앞 job 이 실패했을 때
  # 이 job 이 **건너뛰어지는데**, 건너뛴 필수 검사를 GitHub 이 통과로 세는 설정이
  # 있다. 그러면 빨간 CI 를 머지할 수 있게 된다 — 막으려던 것과 정반대다.
  ci:
    name: ci
    needs: [checks, client, client-coverage, server]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 앞 job 이 하나라도 실패하면 막는다
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "checks=${{ needs.checks.result }} client=${{ needs.client.result }} client-coverage=${{ needs['client-coverage'].result }} server=${{ needs.server.result }}"
          exit 1
      - run: echo "checks · client(샤드) · client-coverage · server 전부 통과"
