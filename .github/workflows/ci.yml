name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: client
      - name: Check JS syntax
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check

      # ARCHITECTURE.md 의 라우트·페이지·컴포넌트 목록은 코드에서 생성한다.
      # 손으로 유지하다 세 번 낡았고(FND-17), PR 템플릿 체크박스로는 또 놓쳤다.
      - name: Docs inventory matches code
        run: npm run docs:inventory:check

      # 인벤토리 생성이 막는 것은 ARCHITECTURE.md 하나다. API.md 와
      # DATA_MODEL.md 는 본문을 코드에서 만들 수 없어 생성 대상이 아니었고,
      # 그래서 강제도 없었다 — 마운트 26개 중 7개, 실테이블 22개 중 3개가 통째로
      # 빠진 채였다(#496). 내용까지 검사하지는 못해도 통째로 빠지는 것은 막는다.
      - name: Docs cover routes and tables
        run: npm run docs:check
      # node --check 는 문법만 보고 서버 src/ 만 본다. 정의되지 않은 식별자는
      # 잡지 못해, import 를 빠뜨린 코드가 테스트 전부 초록인 채로 배포됐다가
      # 브라우저에서 ReferenceError 로 죽은 적이 있다. 여기가 그 자리를 막는다.
      - name: Lint (no-undef)
        run: npm run lint
      # 포트가 겹치면 단독 실행은 통과하고 전체 스위트에서만 간헐 실패한다.
      # 재실행하면 통과해서 원인을 짚기 전까지 무엇이 문제인지 안 보인다.
      # 실제로 두 번 냈고 둘 다 별도 서버를 `PORT + 1` 로 띄운 것이 원인이었다.
      - name: Test ports do not collide
        run: npm run test:ports
      # 릴리즈 아티팩트가 main 과 어긋난 채로 develop 이 굴러가면, develop → main
      # 릴리즈 PR 에서 네 파일이 충돌하고 소유자 bypass 를 쓰게 된다
      # (CONTRIBUTING.md 조건 1번). 세 릴리즈 연속 놓쳤던 자리라 사람 기억 대신
      # 여기서 막는다. develop 대상 PR 에서만 돈다 — 릴리즈 PR 은 버전을 올리는
      # 것이 목적이므로 검사 대상이 아니다.
      - name: Release artifacts in sync with main
        if: github.base_ref == 'develop'
        run: |
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          ./scripts/check-release-sync.sh

      - name: Audit dependencies (root)
        run: npm audit --audit-level=high
      - name: Audit dependencies (client)
        run: npm audit --audit-level=high
        working-directory: client
      - run: npm run build
        working-directory: client
      - name: Test client (vitest)
        run: npm run test:coverage
        working-directory: client
      - run: npm run test:coverage --if-present
