name: PR Title Check

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
  # 머지 큐에서도 이 이름으로 보고해야 한다(#546 B안).
  #
  # 큐는 필수 검사가 **머지 그룹에서** 통과하기를 기다린다. 이 워크플로가 `pull_request`
  # 에서만 돌면 큐에 들어간 항목은 이 검사를 영영 못 받아 상한까지 기다린다.
  merge_group:

permissions:
  pull-requests: write

jobs:
  validate-title:
    runs-on: ubuntu-latest
    steps:
      # 머지 그룹에는 PR 제목이 없다. 검사할 대상 자체가 없으므로 건너뛴다.
      #
      # 건너뛰는 것이 느슨해지는 게 아니다 — 제목은 PR 단계에서 이미 검사됐고,
      # 큐에 들어간 뒤로는 바뀌지 않는다. 여기서는 «이름을 가진 검사가 통과했다» 는
      # 신호만 큐에 주면 된다.
      - name: 머지 그룹에는 검사할 제목이 없다
        if: github.event_name == 'merge_group'
        run: echo "머지 그룹이라 PR 제목 검사를 건너뛴다. 제목은 PR 단계에서 검사됐다."

      - name: Validate PR title follows Conventional Commits
        if: github.event_name != 'merge_group'
        uses: actions/github-script@v9
        with:
          script: |
            const prTitle = context.payload.pull_request.title;
            const allowedTypes = [
              'feat', 'fix', 'docs', 'chore',
              'refactor', 'test', 'ci', 'perf',
              'style', 'revert',
            ];
            const pattern = new RegExp(
              `^(${allowedTypes.join('|')})(\\([^)]+\\))?:\\s.+`
            );

            if (pattern.test(prTitle)) {
              console.log(`✅ PR 제목이 Conventional Commits 형식을 따릅니다: ${prTitle}`);
              return;
            }

            const message =
              '❌ PR 제목이 Conventional Commits 형식을 따르지 않습니다.\n\n' +
              '⚠️ CRITICAL: release-please는 이 형식에 의존하여 CHANGELOG와 버전을 생성합니다. ' +
              '특히 develop → main PR은 형식을 지키지 않으면 릴리즈가 누락될 수 있습니다.\n\n' +
              `현재 제목: ${prTitle}\n\n` +
              '형식: <type>(<scope>)?: <description>\n' +
              `허용 type: ${allowedTypes.join(', ')}\n\n` +
              '예시:\n' +
              '  ✅ feat: add card excel import\n' +
              '  ✅ fix(ci): prevent release-please loop\n' +
              '  ❌ Update workflow\n' +
              '  ❌ 릴리즈 준비';

            try {
              const { owner, repo } = context.repo;
              const issue_number = context.payload.pull_request.number;
              const { data: comments } = await github.rest.issues.listComments({
                owner, repo, issue_number,
              });
              const marker = '<!-- pr-title-check -->';
              const existing = comments.find((c) => c.body.includes(marker));
              const body = `${marker}\n${message}`;
              if (existing) {
                await github.rest.issues.updateComment({
                  owner, repo, comment_id: existing.id, body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner, repo, issue_number, body,
                });
              }
            } catch (err) {
              console.log(`코멘트 작성 실패 (무시하고 계속): ${err.message}`);
            }

            core.setFailed(message);
